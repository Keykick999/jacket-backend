name: Deploy To GCE with Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 # 프로젝트 자바 버전에 맞게 수정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 설정 파일 생성 (빌드 시 포함됨)
      - name: Create application.properties
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > src/main/resources/application.properties

      # 2. 빌드
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 3. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/third-project:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 GCE VM에 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_PRIVATE_KEY }}
          script: |
            # 1. Docker 설치 확인 (없으면 설치 필요)
            if ! command -v docker &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y docker.io
            fi

            # 2. 최신 이미지 가져오기
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/third-project:latest

            # 3. 기존 컨테이너 중지 및 삭제
            sudo docker stop third-project-container || true
            sudo docker rm third-project-container || true

            # 4. 새 컨테이너 실행
            sudo docker run -d \
              --name third-project-container \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/third-project:latest

            # 5. 사용하지 않는 이미지 정리 (용량 관리)
            sudo docker image prune -f