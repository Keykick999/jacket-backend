spring.application.name=incident-analyzer

server.port=8081

# Slack webhook must come from the environment. Rotate the previously committed URL.
slack.webhook.url=${SLACK_WEBHOOK_URL:}

# Gemini / Spring AI — API key comes only from the GEMINI_API_KEY environment variable.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.2

# Avoid debug logs that can include request headers or credentials.
logging.level.com.google.genai=WARN
logging.level.org.springframework.ai.google.genai=WARN

# Incident analysis
incident.llm.enabled=${INCIDENT_LLM_ENABLED:true}
incident.llm.max-tool-calls=4
incident.llm.timeout=180s
incident.llm.cache-ttl=10m
incident.llm.max-evidence-bytes=4096

incident.prometheus.base-url=${PROMETHEUS_BASE_URL:http://localhost:9090}

incident.jfr.directory=${INCIDENT_JFR_DIRECTORY:${user.dir}}
incident.jfr.file-name=jacket-cpu-test.jfr

incident.threaddump.url=${INCIDENT_THREADDUMP_URL:http://localhost:8080/actuator/threaddump}
