spring.application.name=incident-analyzer-test

slack.webhook.url=http://localhost/dummy-slack

spring.ai.model.chat=none
spring.ai.google.genai.api-key=test-dummy-key
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

incident.llm.enabled=false
incident.llm.max-tool-calls=4
incident.llm.timeout=180s
incident.llm.cache-ttl=10m
incident.llm.max-evidence-bytes=4096

incident.prometheus.base-url=http://localhost:9090
incident.jfr.directory=${user.dir}
incident.jfr.file-name=jacket-cpu-test.jfr
incident.threaddump.url=http://localhost:8080/actuator/threaddump
