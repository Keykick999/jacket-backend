<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 완료</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-box { background-color: #fff; border: 1px solid #dbdbdb; border-radius: 12px; padding: 40px; max-width: 400px; text-align: center; }
        .logo { font-size: 2rem; font-weight: 700; margin-bottom: 20px; }
        .code-input-group { display: flex; gap: 5px; margin-bottom: 1rem; }
    </style>
</head>
<body>

<div class="auth-box">
    <div class="logo">Carmmunity</div>

    <h5 th:text="|${nickname}님, 환영합니다!|">사용자님, 환영합니다!</h5>
    <p class="text-muted">소셜 로그인을 완료하려면 사용하실 이메일을 입력하고 인증해주세요.</p>

    <input type="hidden" id="providerId" th:value="${providerId}">
    <input type="hidden" id="provider" th:value="${provider}">
    <input type="hidden" id="nickname" th:value="${nickname}">

    <div class="form-group mb-2">
        <div class="input-group">
            <input type="email" class="form-control" id="emailInput" placeholder="이메일 주소">
            <button class="btn btn-outline-secondary" type="button" id="sendCodeBtn">코드 발송</button>
        </div>
    </div>

    <div class="form-group mb-2">
        <div class="code-input-group">
            <input type="text" class="form-control" id="emailCodeInput" placeholder="인증 코드 6자리">
            <button class="btn btn-outline-success" type="button" id="verifyCodeBtn">인증 확인</button>
        </div>
    </div>

    <div id="emailError" class="text-danger error-message mt-1 mb-3" style="display: none;"></div>

    <button class="btn btn-login w-100" id="completeBtn">가입 완료</button>
    <div id="resultMessage" class="text-danger mt-3" style="display: none;"></div>
</div>

<script>
    let isEmailVerified = false; // 💡 인증 여부를 관리하는 핵심 플래그

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function clearErrors() {
        document.getElementById("emailError").style.display = 'none';
        document.getElementById("resultMessage").style.display = 'none';
        document.getElementById("emailError").textContent = '';
        document.getElementById("resultMessage").textContent = '';
    }

    // 1. 코드 발송 API 호출 (/api/email/send)
    async function sendCode() {
        clearErrors();
        const emailInput = document.getElementById("emailInput");
        const email = emailInput.value.trim();

        if (!isValidEmail(email)) {
            const errorDiv = document.getElementById("emailError");
            errorDiv.textContent = "유효한 이메일 형식이 아닙니다.";
            errorDiv.style.display = 'block';
            return;
        }


        try {
            const res = await fetch("/api/email/send", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, purpose: "link" })
            });

            alert(res.ok ? "인증 코드가 발송되었습니다." : "이메일 발송 실패. 이메일 주소를 확인해주세요.");
        } catch (error) {
            alert("인증 코드 발송 중 오류가 발생했습니다.");
        }
    }

    // 2. 코드 확인 API 호출 (/api/email/verify)
    async function verifyCode() {
        const emailInput = document.getElementById("emailInput");
        const codeInput = document.getElementById("emailCodeInput");
        const email = emailInput.value.trim();
        const code = codeInput.value.trim();
        const errorDiv = document.getElementById("emailError");

        if (!code) {
            errorDiv.textContent = "인증 코드를 입력해주세요.";
            errorDiv.style.display = 'block';
            return;
        }

        const redirectPayload = {
            providerId: document.getElementById('providerId').value,
            provider: document.getElementById('provider').value,
            nickname: document.getElementById('nickname').value,
            email: email, // 사용자가 입력한 이메일
        };

        try {
            const res = await fetch("/api/email/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, code, purpose: "link" })
            });


            if (res.ok) {
                isEmailVerified = true; // 💡 인증 성공! 플래그 설정
                errorDiv.style.display = 'none';
                alert("이메일 인증 완료");

                // 인증 완료 후 추가 수정 방지를 위해 입력 필드 및 버튼 비활성화
                emailInput.disabled = true;
                codeInput.disabled = true;
                document.getElementById("sendCodeBtn").disabled = true;
                document.getElementById("verifyCodeBtn").disabled = true;
            } else if (res.status === 409) {
                // 1. 연동 확인 페이지로 리다이렉트 URL 생성
                const redirectUrl = '/link-confirm?' +
                    `providerId=${redirectPayload.providerId}` +
                    `&provider=${redirectPayload.provider}` +
                    `&nickname=${redirectPayload.nickname}` +
                    `&existingEmail=${redirectPayload.email}`; // redirectPayload 사용

                // 2. 연동 확인 페이지로 이동
                alert("이미 가입된 이메일입니다. 계정 연동을 확인합니다.");
                window.location.href = redirectUrl;
            } else { // 400 Bad Request, 500 Internal Server Error 등 일반적인 실패
                const result = await response.json();
                document.getElementById('resultMessage').textContent = result?.message || "유효하지 않은 요청입니다.";
                document.getElementById('resultMessage').style.display = 'block';
            }
        } catch (error) {
            alert("인증 확인 중 오류가 발생했습니다.");
        }
    }

    // 3. 최종 가입 요청 (/api/users/social-complete)
    async function signUp() {
        clearErrors();

        const email = document.getElementById("emailInput").value.trim();
        const verificationCode = document.getElementById("emailCodeInput").value.trim();
        const errorDiv = document.getElementById("emailError");

        let hasError = false;

        // 💡 최종 가입 전, 인증 완료 여부 확인
        if (!isEmailVerified) {
            errorDiv.textContent = "이메일 인증을 완료해주세요.";
            errorDiv.style.display = 'block';
            hasError = true;
        }

        if (hasError) return;

        const data = {
            email: email,
            nickname: document.getElementById('nickname').value,
            providerId: document.getElementById('providerId').value,
            provider: document.getElementById('provider').value,
            verificationCode: verificationCode // 💡 인증 코드를 최종 DTO에 포함 (서버 검증용)
        };

        try {
            const response = await fetch('/api/users/social-complete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            });

            if (response.ok) {
                alert("회원가입 성공! 로그인 페이지로 이동합니다.");
                window.location.href = '/';
            } else {
                const result = await response.json();
                document.getElementById('resultMessage').textContent = result?.message || "회원가입 실패. 이메일 중복 등을 확인하세요.";
                document.getElementById('resultMessage').style.display = 'block';
            }
        } catch (error) {
            document.getElementById('resultMessage').textContent = "회원가입 요청 중 오류가 발생했습니다.";
            document.getElementById('resultMessage').style.display = 'block';
            console.error("signUp error:", error);
        }
    }

    // 이벤트 리스너 연결
    document.getElementById('sendCodeBtn').addEventListener('click', sendCode);
    document.getElementById('verifyCodeBtn').addEventListener('click', verifyCode);
    document.getElementById('completeBtn').addEventListener('click', signUp);

</script>
</body>
</html>
