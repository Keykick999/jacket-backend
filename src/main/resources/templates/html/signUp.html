<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carmmunity 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');

        html {
            overflow-y: auto;
        }

        body {
            background-color: #fafafa;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px 0;
            min-height: 100vh;
        }

        .signup-box {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            height: 40px;
        }

        .form-floating {
            margin-bottom: 1rem;
            text-align: left;
        }

        .verification-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .btn-submit {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-submit:hover {
            background-color: #0077cc;
        }

        .form-check {
            text-align: left;
            margin-top: 10px;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            display: none;
        }

        .auth-switch {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .auth-switch a {
            color: #0095f6;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="signup-box">
    <div class="logo">
        <img src="/image/logo.png" alt="Carmmunity Logo">
        Carmmunity
    </div>

    <div class="form-floating">
        <input type="text" class="form-control" id="userId" placeholder="아이디">
        <label for="userId">아이디</label>
        <div id="userIdError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="password" class="form-control" id="password" placeholder="비밀번호">
        <label for="password">비밀번호</label>
        <div id="passwordError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="text" class="form-control" id="name" placeholder="이름">
        <label for="name">이름</label>
        <div id="nameError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="email" class="form-control" id="email" placeholder="이메일">
        <label for="email">이메일</label>
        <div id="emailError" class="error-message"></div>
    </div>

    <div class="verification-group">
        <button class="btn btn-outline-secondary w-100" onclick="sendCode()">코드 발송</button>
    </div>

    <div class="verification-group">
        <input type="text" class="form-control" id="emailCode" placeholder="인증코드">
        <button class="btn btn-outline-secondary" onclick="verifyCode()">코드 확인</button>
    </div>

    <div class="form-floating">
        <input type="text" class="form-control" id="nickname" placeholder="닉네임">
        <label for="nickname">닉네임</label>
        <div id="nicknameError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="tel" class="form-control" id="phone" placeholder="전화번호 (선택)">
        <label for="phone">전화번호 (선택)</label>
    </div>


    <div id="termsContainer" class="mb-3 text-start"></div>

    <button class="btn-submit" onclick="signUp()">회원가입</button>

    <div id="resultMessage" class="error-message mt-3"></div>

    <div class="auth-switch">
        계정이 있으신가요? <a href="/login">로그인</a>
    </div>
</div>
<script src="/js/signUp.js"></script>
</body>
</html>
