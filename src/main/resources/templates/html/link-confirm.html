<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계정 연동 확인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .link-box { background-color: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 40px; max-width: 450px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .provider-logo { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
        .data-display { background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-weight: 600; }
    </style>
</head>
<body>

<div class="link-box">
    <div class="provider-logo" th:text="${provider} + ' 연동'">카카오 연동</div>
    <h3 class="mt-4">기존 계정 연동 확인</h3>

    <p class="mt-3 text-muted">인증된 계정 정보</p>
    <div class="data-display" th:text="${existingEmail}">user@example.com</div>

    <p>
        이 **<span th:text="${provider}"></span>** 계정을 위 이메일 계정 (기존 계정)과 **연동**하시겠습니까?
        <br>
        <small class="text-secondary">(연동 시, 해당 소셜 계정으로도 로그인할 수 있게 됩니다.)</small>
    </p>

    <input type="hidden" id="providerId" th:value="${providerId}">
    <input type="hidden" id="provider" th:value="${provider}">
    <input type="hidden" id="existingEmail" th:value="${existingEmail}"> <div class="mt-4 d-flex justify-content-between gap-3">
    <button class="btn btn-outline-secondary flex-fill" id="cancelBtn">취소</button>
    <button class="btn btn-success flex-fill" id="linkBtn">계정 연동 및 로그인</button>
</div>

    <div id="resultMessage" class="text-danger mt-3" style="display: none;"></div>
</div>

<script>
    document.getElementById('linkBtn').addEventListener('click', async () => {
        clearErrors();

        // 💡 [수정] DTO에 필요한 모든 필드를 Hidden Input에서 가져옵니다.
        const data = {
            email: document.getElementById('existingEmail').value,
            providerId: document.getElementById('providerId').value,
            provider: document.getElementById('provider').value,
        };
        console.log(data);

        try {
            // 연동 API 호출
            const response = await fetch('/api/users/link-account', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    // 🚨 [주의] 이 API는 토큰을 반환하므로, Authorization 헤더는 필요 없습니다.
                },
                body: JSON.stringify(data),
            });

            if (response.ok) {
                const result = await response.json();

                // 1. JWT 토큰 저장
                localStorage.setItem('token', result.accessToken);

                // 2. 로그인 성공 처리
                alert('계정 연동 및 로그인 성공!');
                window.location.href = '/main'; // 메인 페이지로 이동
            } else {
                const result = await response.json();
                document.getElementById('resultMessage').textContent = result?.message || '연동 중 알 수 없는 오류가 발생했습니다.';
                document.getElementById('resultMessage').style.display = 'block';
            }
        } catch (error) {
            document.getElementById('resultMessage').textContent = '서버 통신 실패.';
            document.getElementById('resultMessage').style.display = 'block';
        }
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
        alert('계정 연동을 취소합니다. 로그인 페이지로 돌아갑니다.');
        window.location.href = '/';
    });

    function clearErrors() {
        document.getElementById('resultMessage').style.display = 'none';
        document.getElementById('resultMessage').textContent = '';
    }
</script>
</body>
</html>
