<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 실패</title>
</head>
<body>
<h1>로그인에 실패하였습니다.</h1>

<div th:if="${error == 'EMAIL_CONSENT_REQUIRED'}">
    <p>
        소셜 로그인 시 '이메일' 정보 제공에 동의해주셔야 서비스 이용이 가능합니다.
        <br>
        로그인을 다시 시도하여 이메일 제공에 동의해주세요.
    </p>
</div>
<div th:unless="${error == 'EMAIL_CONSENT_REQUIRED'}">
    <p>알 수 없는 오류가 발생했습니다. (에러 코드: <span th:text="${error}"></span>)</p>
</div>

<br>
<a href="/">로그인 페이지로 돌아가기</a>
</body>
</html>
